<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Srivardhini</title>
    <meta name="description" content="Get in touch with John Doe.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">John Doe</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="section-title">
            <div class="container">
                <h1>Contact Me</h1>
                <p style="font-size: 1rem; color: var(--text-muted); margin-top: 0.5rem;">Have a question or want to
                    work together?</p>
            </div>
        </section>

        <section>
            <div class="contact-container">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <p style="margin-bottom: 0.5rem;"><strong>Email:</strong> john.doe@example.com</p>
                    <p style="margin-bottom: 0.5rem;"><strong>Phone:</strong> +1 (555) 123-4567</p>
                    <p><strong>Location:</strong> New York, NY</p>
                </div>

                <form action="mailto:john.doe@example.com" method="post" enctype="text/plain">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your Name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Your Email">
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required placeholder="Subject">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Your Message"></textarea>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; border: none; cursor: pointer;">Send
                        Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Srivardhini. Built with HTML5 & CSS3.</p>
        </div>
    </footer>

</body>

</html>
